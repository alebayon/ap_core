version: 2

models:
  - name: dim_vendor_sap
    description: >
      SAP vendor dimension (ap_core). One row per vendor_id including deleted
      (LOEVM) rows; is_active false when deletion_flag is set.
    columns:
      - name: vendor_id
        description: SAP vendor account number (from LIFNR).
        tests:
          - unique
          - not_null
      - name: is_active
        description: True when deletion_flag is null (not marked for deletion).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_critical
        description: >
          Governed flag from raw vendor master; not derived from spend or lateness.
          Used for critical-vendor escalation in OTP (and optionally CD later).
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: critical_reason
        description: >
          Short narrative why the vendor is critical; null when is_critical is false.

  - name: dim_vendor_coupa
    description: >
      Coupa supplier dimension (ap_core). One row per supplier id including
      inactive status; filter is_active in marts when needed.
    columns:
      - name: vendor_id
        description: Coupa supplier system id (from raw id).
        tests:
          - unique
          - not_null
      - name: status
        description: Coupa supplier status (e.g. active, inactive).
        tests:
          - not_null
      - name: is_active
        description: True when status = active.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: is_critical
        description: >
          Governed flag from Coupa supplier master; aligned with SAP critical policy.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true, false]
      - name: critical_reason
        description: >
          Short narrative why the supplier is critical; null when is_critical is false.